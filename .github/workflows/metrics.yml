name: Developer Metrics Dashboard Engine

on:
  # Support manual workflow execution from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: metrics-engine
  cancel-in-progress: true

jobs:
  github-metrics:
    name: Generate Live Developer Analytics SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build lowlighter/metrics Infographic Dashboard
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: metafixerhub
          template: classic
          base: header
          config_theme: github-dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_message: "chore(analytics): auto-update developer metrics dashboard [skip ci]"
