name: Developer Metrics Dashboard Engine

on:
  # Schedule automatic daily updates at 00:00 UTC (05:30 AM IST)
  schedule:
    - cron: "0 0 * * *"
  # Support manual workflow execution from the GitHub Actions tab
  workflow_dispatch:
  # Automatically refresh when the README or workflow is updated
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics-engine
  cancel-in-progress: true

jobs:
  github-metrics:
    name: Generate Live Developer Analytics SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build lowlighter/metrics Infographic Dashboard
        uses: lowlighter/metrics@latest
        with:
          # Target file path
          filename: github-metrics.svg
          
          # GitHub Token with read scopes
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Target User & Timezone
          user: metafixerhub
          config_timezone: Asia/Kolkata
          
          # Visual Layout & Dark Mode Theme matching Dashboard aesthetic
          template: classic
          base: header, activity, community, repositories, metadata
          config_order: base.header, isocalendar, habits, languages, topics, achievements, lines
          
          # 3D Isometric Calendar Plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Coding Habits and Commit Timeline Plugin
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          
          # Programming Languages Distribution Plugin
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          
          # Genuine Account Achievements Plugin (displays verified GitHub achievements)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          # Mastered Topics & Icons
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          
          # Lines of Code & Velocity
          plugin_lines: yes
          plugin_lines_history_limit: 2
          plugin_lines_repositories_limit: 4
          
          # Notable Contributions & Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          
          # Commit & Push Options
          output_action: commit
          committer_message: "chore(analytics): auto-update developer metrics dashboard [skip ci]"
