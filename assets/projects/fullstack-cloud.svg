<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
  <defs>
    <linearGradient id="pcard-bg-fs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090D13" />
    </linearGradient>
    <linearGradient id="pcard-border-fs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39D353" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="460" height="200" rx="10" fill="url(#pcard-bg-fs)" stroke="#30363D" stroke-width="1.2" />

  <!-- Top Accent Highlight -->
  <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 450 0 C 455.5 0 460 4.5 460 10 L 460 3 C 460 1.5 458.5 0 457 0 L 3 0 C 1.5 0 0 1.5 0 3 Z" fill="url(#pcard-border-fs)" />

  <!-- Category & Status Bar -->
  <g transform="translate(24, 20)">
    <rect width="144" height="20" rx="4" fill="#14281E" stroke="#238636" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#39D353" />
    <text x="20" y="14" class="mono" font-size="9.5" font-weight="700" fill="#39D353" letter-spacing="0.5">FULL-STACK &amp; CLOUD</text>

    <!-- Star / Fork Stat simulation -->
    <g transform="translate(340, 2)">
      <circle cx="8" cy="8" r="3" fill="#39D353" />
      <text x="18" y="12" class="mono" font-size="10" font-weight="600" fill="#8B949E">SCALABLE</text>
    </g>
  </g>

  <!-- Project Title -->
  <text x="24" y="68" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">
    Enterprise Cloud Microservices Mesh
  </text>

  <!-- Project Description -->
  <text x="24" y="93" class="sans" font-size="12" fill="#8B949E">
    Event-driven cloud platform engineered with reactive TypeScript frontends,
  </text>
  <text x="24" y="111" class="sans" font-size="12" fill="#8B949E">
    asynchronous Go microservices, and distributed ACID data caching.
  </text>

  <!-- Visual Schematic Graphic (Right side) -->
  <g transform="translate(385, 90)">
    <rect x="-16" y="-22" width="32" height="14" rx="2" fill="#161B22" stroke="#58A6FF" stroke-width="1.2" />
    <rect x="-16" y="-3" width="32" height="14" rx="2" fill="#161B22" stroke="#39D353" stroke-width="1.2" />
    <rect x="-16" y="16" width="32" height="14" rx="2" fill="#161B22" stroke="#BC8CFF" stroke-width="1.2" />
    <circle cx="-10" cy="-15" r="2" fill="#58A6FF" />
    <circle cx="-10" cy="4" r="2" fill="#39D353" />
    <circle cx="-10" cy="23" r="2" fill="#BC8CFF" />
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="82" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="41" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#58A6FF">TypeScript</text>

    <rect x="90" y="0" width="68" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="124" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E6EDF3">Next.js</text>

    <rect x="166" y="0" width="45" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="188.5" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#39D353">Go</text>

    <rect x="219" y="0" width="82" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="260" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#388BFD">PostgreSQL</text>
  </g>
</svg>
