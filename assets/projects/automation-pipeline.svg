<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
  <defs>
    <linearGradient id="pcard-bg-ap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090D13" />
    </linearGradient>
    <linearGradient id="pcard-border-ap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39D353" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="460" height="200" rx="10" fill="url(#pcard-bg-ap)" stroke="#30363D" stroke-width="1.2" />

  <!-- Top Accent Highlight -->
  <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 450 0 C 455.5 0 460 4.5 460 10 L 460 3 C 460 1.5 458.5 0 457 0 L 3 0 C 1.5 0 0 1.5 0 3 Z" fill="url(#pcard-border-ap)" />

  <!-- Category & Status Bar -->
  <g transform="translate(24, 20)">
    <rect width="160" height="20" rx="4" fill="#14281E" stroke="#238636" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#39D353" />
    <text x="20" y="14" class="mono" font-size="9.5" font-weight="700" fill="#39D353" letter-spacing="0.5">WORKFLOW AUTOMATION</text>

    <!-- Star / Fork Stat simulation -->
    <g transform="translate(340, 2)">
      <circle cx="8" cy="8" r="3" fill="#39D353" />
      <text x="18" y="12" class="mono" font-size="10" font-weight="600" fill="#8B949E">AUTONOMOUS</text>
    </g>
  </g>

  <!-- Project Title -->
  <text x="24" y="68" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">
    Intelligent CI/CD &amp; Telemetry Pipelines
  </text>

  <!-- Project Description -->
  <text x="24" y="93" class="sans" font-size="12" fill="#8B949E">
    Declarative workflow engines automating software testing, containerized
  </text>
  <text x="24" y="111" class="sans" font-size="12" fill="#8B949E">
    artifact deployment, and real-time developer metrics analytics.
  </text>

  <!-- Visual Schematic Graphic (Right side: DAG nodes) -->
  <g transform="translate(385, 90)">
    <circle cx="-20" cy="0" r="7" fill="#161B22" stroke="#58A6FF" stroke-width="1.5" />
    <circle cx="0" cy="-12" r="7" fill="#161B22" stroke="#39D353" stroke-width="1.5" />
    <circle cx="0" cy="12" r="7" fill="#161B22" stroke="#39D353" stroke-width="1.5" />
    <circle cx="20" cy="0" r="7" fill="#238636" stroke="#39D353" stroke-width="1.5" />
    <line x1="-13" y1="-3" x2="-6" y2="-9" stroke="#8B949E" stroke-width="1.2" />
    <line x1="-13" y1="3" x2="-6" y2="9" stroke="#8B949E" stroke-width="1.2" />
    <line x1="6" y1="-9" x2="13" y2="-3" stroke="#8B949E" stroke-width="1.2" />
    <line x1="6" y1="9" x2="13" y2="3" stroke="#8B949E" stroke-width="1.2" />
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="105" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="52.5" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#58A6FF">GitHub Actions</text>

    <rect x="113" y="0" width="62" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="144" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#388BFD">Docker</text>

    <rect x="183" y="0" width="50" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="208" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#39D353">Bash</text>

    <rect x="241" y="0" width="76" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="279" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#BC8CFF">Terraform</text>
  </g>
</svg>
