<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
  <defs>
    <linearGradient id="pcard-bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090D13" />
    </linearGradient>
    <linearGradient id="pcard-border-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#BC8CFF" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="460" height="200" rx="10" fill="url(#pcard-bg-ai)" stroke="#30363D" stroke-width="1.2" />

  <!-- Top Accent Highlight -->
  <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 450 0 C 455.5 0 460 4.5 460 10 L 460 3 C 460 1.5 458.5 0 457 0 L 3 0 C 1.5 0 0 1.5 0 3 Z" fill="url(#pcard-border-ai)" />

  <!-- Category & Status Bar -->
  <g transform="translate(24, 20)">
    <rect width="130" height="20" rx="4" fill="#1B2A3D" stroke="#388BFD" stroke-width="0.8" />
    <circle cx="10" cy="10" r="3" fill="#58A6FF" />
    <text x="20" y="14" class="mono" font-size="9.5" font-weight="700" fill="#58A6FF" letter-spacing="0.5">AI &amp; DEEP LEARNING</text>

    <!-- Star / Fork Stat simulation -->
    <g transform="translate(340, 2)">
      <circle cx="8" cy="8" r="3" fill="#39D353" />
      <text x="18" y="12" class="mono" font-size="10" font-weight="600" fill="#8B949E">PRODUCTION</text>
    </g>
  </g>

  <!-- Project Title -->
  <text x="24" y="68" class="sans" font-size="19" font-weight="700" fill="#E6EDF3">
    Autonomous Neural Agent Framework
  </text>

  <!-- Project Description -->
  <text x="24" y="93" class="sans" font-size="12" fill="#8B949E">
    Multi-agent cognitive architecture combining LLMs, dynamic tool-use,
  </text>
  <text x="24" y="111" class="sans" font-size="12" fill="#8B949E">
    and vector memory retrieval for autonomous enterprise workflows.
  </text>

  <!-- Visual Schematic Graphic (Right side) -->
  <g transform="translate(365, 85)">
    <circle cx="0" cy="0" r="14" fill="#161B22" stroke="#58A6FF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#58A6FF" />
    <circle cx="35" cy="-18" r="9" fill="#161B22" stroke="#BC8CFF" stroke-width="1.2" />
    <circle cx="35" cy="18" r="9" fill="#161B22" stroke="#39D353" stroke-width="1.2" />
    <line x1="14" y1="-5" x2="26" y2="-14" stroke="#58A6FF" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="14" y1="5" x2="26" y2="14" stroke="#58A6FF" stroke-width="1.2" stroke-dasharray="2,2" />
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(24, 150)">
    <rect x="0" y="0" width="62" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="31" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#58A6FF">Python</text>

    <rect x="70" y="0" width="70" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="105" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#BC8CFF">PyTorch</text>

    <rect x="148" y="0" width="80" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="188" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#39D353">LangChain</text>

    <rect x="236" y="0" width="64" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="268" y="15" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#E6EDF3">FastAPI</text>
  </g>
</svg>
