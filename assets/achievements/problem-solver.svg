<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96">
  <defs>
    <linearGradient id="bg-grad-ps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="border-grad-ps" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F778BA" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
    <filter id="glow-ps" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Body -->
  <rect width="340" height="96" rx="8" fill="url(#bg-grad-ps)" stroke="#30363D" stroke-width="1.2" />
  <path d="M 0 8 C 0 3.6 3.6 0 8 0 L 120 0 L 105 96 L 8 96 C 3.6 96 0 92.4 0 88 Z" fill="#2E1624" fill-opacity="0.35" />
  
  <!-- Left Hex Badge Container -->
  <g transform="translate(48, 48)">
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17" fill="#0D1117" stroke="url(#border-grad-ps)" stroke-width="1.8" filter="url(#glow-ps)" />
    <polygon points="0,-27 23,-13 23,13 0,27 -23,13 -23,-13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    
    <!-- Problem Solver Maze / Algorithm Icon -->
    <path d="M -12 -10 L 0 -10 L 0 0 L 12 0 L 12 10" fill="none" stroke="#F778BA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-12" cy="-10" r="3" fill="#58A6FF" />
    <circle cx="12" cy="10" r="3.5" fill="#39D353" />
    <circle cx="0" cy="0" r="2.5" fill="#F778BA" />
    <!-- Secondary circuit path -->
    <path d="M -10 8 L -4 8 L -4 -2" fill="none" stroke="#58A6FF" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Right Information Section -->
  <g transform="translate(102, 16)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="162" height="18" rx="4" fill="#321627" stroke="#BF3989" stroke-width="0.7" />
    <text x="6" y="12.5" class="mono" font-size="9" font-weight="700" fill="#F778BA" letter-spacing="0.5">MILESTONE // ALGORITHMS</text>
    
    <!-- Title -->
    <text x="0" y="38" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Creative Problem Solver</text>
    
    <!-- Description / Spec -->
    <text x="0" y="55" class="mono" font-size="10" fill="#8B949E">Algorithmic Rigor &amp; Architecture</text>
    
    <!-- Level Bar / Stars -->
    <g transform="translate(0, 62)">
      <rect width="130" height="3" rx="1.5" fill="#21262D" />
      <rect width="115" height="3" rx="1.5" fill="url(#border-grad-ps)" />
      <text x="140" y="4" class="mono" font-size="8.5" font-weight="600" fill="#F778BA">TIER IV</text>
    </g>
  </g>

  <!-- Corner Status Pip -->
  <circle cx="324" cy="16" r="3" fill="#F778BA" />
</svg>
