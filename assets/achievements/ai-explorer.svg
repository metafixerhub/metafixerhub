<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96">
  <defs>
    <linearGradient id="bg-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="border-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#BC8CFF" />
    </linearGradient>
    <linearGradient id="icon-grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#D2A8FF" />
    </linearGradient>
    <filter id="glow-ai" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Body -->
  <rect width="340" height="96" rx="8" fill="url(#bg-grad-ai)" stroke="#30363D" stroke-width="1.2" />
  <path d="M 0 8 C 0 3.6 3.6 0 8 0 L 120 0 L 105 96 L 8 96 C 3.6 96 0 92.4 0 88 Z" fill="#1F242C" fill-opacity="0.5" />
  
  <!-- Left Hex Badge Container -->
  <g transform="translate(48, 48)">
    <!-- Hexagon Outer -->
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17" fill="#0D1117" stroke="url(#border-grad-ai)" stroke-width="1.8" filter="url(#glow-ai)" />
    <!-- Hexagon Inner -->
    <polygon points="0,-27 23,-13 23,13 0,27 -23,13 -23,-13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    
    <!-- AI Neural Network Core Icon -->
    <!-- Center Node -->
    <circle cx="0" cy="0" r="5" fill="url(#icon-grad-ai)" />
    <!-- Outer Nodes -->
    <circle cx="-13" cy="-10" r="3" fill="#58A6FF" />
    <circle cx="13" cy="-10" r="3" fill="#58A6FF" />
    <circle cx="-13" cy="10" r="3" fill="#BC8CFF" />
    <circle cx="13" cy="10" r="3" fill="#BC8CFF" />
    <circle cx="0" cy="-15" r="2.5" fill="#58A6FF" />
    <circle cx="0" cy="15" r="2.5" fill="#BC8CFF" />
    <!-- Synaptic Connections -->
    <line x1="-13" y1="-10" x2="0" y2="0" stroke="#58A6FF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="13" y1="-10" x2="0" y2="0" stroke="#58A6FF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="-13" y1="10" x2="0" y2="0" stroke="#BC8CFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="13" y1="10" x2="0" y2="0" stroke="#BC8CFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="0" y1="-15" x2="-13" y2="-10" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.6" />
    <line x1="0" y1="-15" x2="13" y2="-10" stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.6" />
  </g>

  <!-- Right Information Section -->
  <g transform="translate(102, 16)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="138" height="18" rx="4" fill="#1B2A3D" stroke="#388BFD" stroke-width="0.7" />
    <text x="6" y="12.5" class="mono" font-size="9" font-weight="700" fill="#58A6FF" letter-spacing="0.5">MILESTONE // AI &amp; ML</text>
    
    <!-- Title -->
    <text x="0" y="38" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">AI Explorer</text>
    
    <!-- Description / Spec -->
    <text x="0" y="55" class="mono" font-size="10" fill="#8B949E">Autonomous Models &amp; Neural Agents</text>
    
    <!-- Level Bar / Stars -->
    <g transform="translate(0, 62)">
      <rect width="130" height="3" rx="1.5" fill="#21262D" />
      <rect width="105" height="3" rx="1.5" fill="url(#border-grad-ai)" />
      <text x="140" y="4" class="mono" font-size="8.5" font-weight="600" fill="#BC8CFF">TIER IV</text>
    </g>
  </g>

  <!-- Corner Status Pip -->
  <circle cx="324" cy="16" r="3" fill="#58A6FF" />
</svg>
