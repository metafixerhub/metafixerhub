<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96">
  <defs>
    <linearGradient id="bg-grad-fs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="border-grad-fs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39D353" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>
    <linearGradient id="icon-grad-fs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39D353" />
      <stop offset="100%" stop-color="#2EA043" />
    </linearGradient>
    <filter id="glow-fs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Body -->
  <rect width="340" height="96" rx="8" fill="url(#bg-grad-fs)" stroke="#30363D" stroke-width="1.2" />
  <path d="M 0 8 C 0 3.6 3.6 0 8 0 L 120 0 L 105 96 L 8 96 C 3.6 96 0 92.4 0 88 Z" fill="#18271E" fill-opacity="0.4" />
  
  <!-- Left Hex Badge Container -->
  <g transform="translate(48, 48)">
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17" fill="#0D1117" stroke="url(#border-grad-fs)" stroke-width="1.8" filter="url(#glow-fs)" />
    <polygon points="0,-27 23,-13 23,13 0,27 -23,13 -23,-13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    
    <!-- Full-Stack Layered Icon -->
    <!-- Top Layer: Frontend / Window -->
    <path d="M -13 -13 L 13 -13 L 11 -6 L -11 -6 Z" fill="#58A6FF" />
    <!-- Middle Layer: API Gateway / Network -->
    <path d="M -14 -3 L 14 -3 L 12 4 L -12 4 Z" fill="#39D353" />
    <!-- Bottom Layer: Database Cylinder Base -->
    <ellipse cx="0" cy="9" rx="12" ry="4" fill="#2EA043" />
    <path d="M -12 9 C -12 13 12 13 12 9 L 12 13 C 12 17 -12 17 -12 13 Z" fill="#238636" />
  </g>

  <!-- Right Information Section -->
  <g transform="translate(102, 16)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="156" height="18" rx="4" fill="#1A2D23" stroke="#2EA043" stroke-width="0.7" />
    <text x="6" y="12.5" class="mono" font-size="9" font-weight="700" fill="#39D353" letter-spacing="0.5">MILESTONE // FULL-STACK</text>
    
    <!-- Title -->
    <text x="0" y="38" class="sans" font-size="16" font-weight="700" fill="#E6EDF3">Full-Stack Builder</text>
    
    <!-- Description / Spec -->
    <text x="0" y="55" class="mono" font-size="10" fill="#8B949E">Distributed Cloud &amp; Reactive Web</text>
    
    <!-- Level Bar / Stars -->
    <g transform="translate(0, 62)">
      <rect width="130" height="3" rx="1.5" fill="#21262D" />
      <rect width="112" height="3" rx="1.5" fill="url(#border-grad-fs)" />
      <text x="140" y="4" class="mono" font-size="8.5" font-weight="600" fill="#39D353">TIER IV</text>
    </g>
  </g>

  <!-- Corner Status Pip -->
  <circle cx="324" cy="16" r="3" fill="#39D353" />
</svg>
