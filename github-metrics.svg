<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Isometric Pillar Gradients -->
    <linearGradient id="iso-top-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39D353" />
      <stop offset="100%" stop-color="#2EA043" />
    </linearGradient>
    <linearGradient id="iso-left-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#196C2E" />
    </linearGradient>
    <linearGradient id="iso-right-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <filter id="avatar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="avatar-circle">
      <circle cx="110" cy="150" r="65" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #E6EDF3; }
    .subheading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #8B949E; }
  </style>

  <!-- Main Background Container -->
  <rect width="1200" height="300" rx="12" fill="url(#card-bg)" stroke="#30363D" stroke-width="1.2" />

  <!-- ==================== LEFT: IDENTITY & JOINED TAG ==================== -->
  <g transform="translate(0, 0)">
    <!-- Avatar Outer Ring -->
    <circle cx="110" cy="150" r="68" fill="#161B22" stroke="#58A6FF" stroke-width="2.5" filter="url(#avatar-glow)" />
    
    <!-- User Avatar Image with high-tech fallback -->
    <g clip-path="url(#avatar-circle)">
      <image href="https://avatars.githubusercontent.com/u/228180443?v=4" x="45" y="85" width="130" height="130" preserveAspectRatio="xMidYMid slice" />
      <circle cx="110" cy="140" r="30" fill="#30363D" />
      <circle cx="110" cy="135" r="18" fill="#E6EDF3" />
    </g>

    <!-- Mini status pip on avatar -->
    <circle cx="162" cy="190" r="8" fill="#0D1117" />
    <circle cx="162" cy="190" r="5.5" fill="#39D353" />

    <!-- Developer Specs -->
    <g transform="translate(205, 80)">
      <text x="0" y="24" class="heading">Nur Mohammad Mandal</text>
      <text x="0" y="48" class="mono" font-size="14" font-weight="600" fill="#39D353">@metafixerhub</text>

      <!-- The Joined Comments Tag (No straight line!) -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="230" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1" />
        <circle cx="14" cy="15" r="3.5" fill="#58A6FF" />
        <text x="26" y="19.5" class="mono" font-size="11.5" font-weight="600" fill="#E6EDF3">Joined GitHub August 2025</text>
      </g>

      <!-- Workspaces Tag -->
      <g transform="translate(242, 72)">
        <rect x="0" y="0" width="170" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1" />
        <circle cx="14" cy="15" r="3.5" fill="#39D353" />
        <text x="26" y="19.5" class="mono" font-size="11.5" font-weight="600" fill="#E6EDF3">18 Repositories</text>
      </g>

      <!-- Status Tag -->
      <g transform="translate(0, 114)">
        <text x="0" y="0" class="subheading">⚡ Software Engineer • AI Systems • Distributed Cloud • Robotics</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT: ISOMETRIC CONTRIBUTION CALENDAR ==================== -->
  <g transform="translate(680, 50)">
    <!-- Header -->
    <g transform="translate(20, 10)">
      <text x="0" y="16" class="sans" font-size="15" font-weight="700" fill="#58A6FF">Contributions calendar</text>
      <text x="280" y="16" class="mono" font-size="11" fill="#8B949E">🔥 Streak: <tspan fill="#39D353" font-weight="600">Active</tspan> • 📈 <tspan fill="#58A6FF" font-weight="600">Daily</tspan></text>
    </g>

    <!-- 3D Isometric Calendar Heatmap -->
    <g transform="translate(60, 48)">
      <!-- Isometric Base Grid -->
      <path d="M 0 50 L 190 0 L 380 50 L 190 100 Z" fill="#161B22" stroke="#30363D" stroke-width="0.8" />
      
      <!-- Row 1 Pillars -->
      <g transform="translate(60, 28)">
        <polygon points="12,0 24,6 12,12 0,6" fill="url(#iso-top-green)" />
        <polygon points="0,6 12,12 12,26 0,20" fill="url(#iso-left-green)" />
        <polygon points="12,12 24,6 24,20 12,26" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(100, 8)">
        <polygon points="14,0 28,7 14,14 0,7" fill="url(#iso-top-green)" />
        <polygon points="0,7 14,14 14,38 0,31" fill="url(#iso-left-green)" />
        <polygon points="14,14 28,7 28,31 14,38" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(140, 22)">
        <polygon points="12,0 24,6 12,12 0,6" fill="url(#iso-top-green)" />
        <polygon points="0,6 12,12 12,24 0,18" fill="url(#iso-left-green)" />
        <polygon points="12,12 24,6 24,18 12,24" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(180, -2)">
        <polygon points="15,0 30,8 15,16 0,8" fill="url(#iso-top-green)" />
        <polygon points="0,8 15,16 15,44 0,36" fill="url(#iso-left-green)" />
        <polygon points="15,16 30,8 30,36 15,44" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(225, 14)">
        <polygon points="13,0 26,7 13,14 0,7" fill="url(#iso-top-green)" />
        <polygon points="0,7 13,14 13,30 0,23" fill="url(#iso-left-green)" />
        <polygon points="13,14 26,7 26,23 13,30" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(265, 26)">
        <polygon points="12,0 24,6 12,12 0,6" fill="url(#iso-top-green)" />
        <polygon points="0,6 12,12 12,22 0,16" fill="url(#iso-left-green)" />
        <polygon points="12,12 24,6 24,16 12,22" fill="url(#iso-right-green)" />
      </g>

      <!-- Row 2 Front Pillars -->
      <g transform="translate(125, 42)">
        <polygon points="12,0 24,6 12,12 0,6" fill="url(#iso-top-green)" />
        <polygon points="0,6 12,12 12,20 0,14" fill="url(#iso-left-green)" />
        <polygon points="12,12 24,6 24,14 12,20" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(170, 34)">
        <polygon points="14,0 28,7 14,14 0,7" fill="url(#iso-top-green)" />
        <polygon points="0,7 14,14 14,28 0,21" fill="url(#iso-left-green)" />
        <polygon points="14,14 28,7 28,21 14,28" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(215, 40)">
        <polygon points="12,0 24,6 12,12 0,6" fill="url(#iso-top-green)" />
        <polygon points="0,6 12,12 12,18 0,12" fill="url(#iso-left-green)" />
        <polygon points="12,12 24,6 24,12 12,18" fill="url(#iso-right-green)" />
      </g>

      <g transform="translate(255, 48)">
        <polygon points="10,0 20,5 10,10 0,5" fill="url(#iso-top-green)" />
        <polygon points="0,5 10,10 10,16 0,11" fill="url(#iso-left-green)" />
        <polygon points="10,10 20,5 20,11 10,16" fill="url(#iso-right-green)" />
      </g>
    </g>
  </g>
</svg>
